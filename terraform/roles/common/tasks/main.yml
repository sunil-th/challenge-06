---
- name: Ensure /etc/hosts contains hostnames for cluster
  lineinfile:
    path: /etc/hosts
    regexp: "{{ item.ip }}\\s+{{ item.name }}"
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop:
    - { ip: "{{ hostvars['c8.local']['ansible_host'] | default(hostvars[inventory_hostname]['ansible_host'] | default('')) }}", name: "c8.local" }
    - { ip: "{{ hostvars['u21.local']['ansible_host'] | default(hostvars[inventory_hostname]['ansible_host'] | default('')) }}", name: "u21.local" }
  when: hostvars['c8.local'] is defined and hostvars['u21.local'] is defined

- name: Disable SELinux (RedHat)
  command: setenforce 0
  when: ansible_facts['os_family'] == 'RedHat'
  ignore_errors: yes

- name: Persist SELinux disabled
  replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=.*'
    replace: 'SELINUX=disabled'
  when: ansible_facts['os_family'] == 'RedHat'
  ignore_errors: yes

- name: Stop firewalld on RedHat
  service:
    name: firewalld
    state: stopped
    enabled: no
  when: ansible_facts['os_family'] == 'RedHat'
  ignore_errors: yes

- name: Stop ufw on Debian
  service:
    name: ufw
    state: stopped
    enabled: no
  when: ansible_facts['os_family'] == 'Debian'
  ignore_errors: yes
