---
- name: Install prerequisites
  apt:
    name:
      - curl
      - sudo
    state: present
    update_cache: yes

- name: Install Netdata via kickstart
  shell: bash <(curl -Ss https://my-netdata.io/kickstart.sh) --dont-wait
  args:
    warn: false
  register: netdata_result
  changed_when: "'FAILED' not in netdata_result.stderr"

- name: Ensure netdata service is running
  systemd:
    name: netdata
    state: started
    enabled: yes

- name: Ensure netdata listens on 0.0.0.0
  lineinfile:
    path: /etc/netdata/netdata.conf
    regexp: '^  bind to ='
    line: '  bind to = 0.0.0.0'
  notify: restart netdata
  ignore_errors: yes

handlers:
  - name: restart netdata
    systemd:
      name: netdata
      state: restarted
