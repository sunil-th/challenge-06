---
# All hosts: use python3 for Ansible modules (inventory sets ansible_python_interpreter)
- name: Common Linux hardening (SELinux / firewalld)
  hosts: all
  become: true
  gather_facts: yes

  tasks:
    - name: Gather a minimal set of facts (explicit)
      ansible.builtin.setup:
        gather_subset: min

    - name: Disable SELinux at runtime (if enforcing) - RHEL family
      ansible.builtin.command:
        cmd: setenforce 0
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - (ansible_facts.get('selinux') is defined and ansible_facts.selinux.status == "Enforcing")
      ignore_errors: true

    - name: Persistently disable SELinux (RHEL family)
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=disabled'
      when: ansible_facts['os_family'] == 'RedHat'
      ignore_errors: true

    - name: Stop and disable firewalld (RHEL family)
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false
      when: ansible_facts['os_family'] == 'RedHat'
      ignore_errors: true

# Frontend tasks (install/configure nginx and proxy to backend:19999)
- name: Frontend - Nginx reverse proxy to backend
  hosts: frontend
  become: true
  gather_facts: yes

  tasks:
    - name: Install nginx (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install nginx (RHEL / Amazon Linux)
      ansible.builtin.yum:
        name: nginx
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Write nginx reverse proxy config (template)
      ansible.builtin.template:
        src: nginx_reverse_proxy.conf.j2
        dest: /etc/nginx/conf.d/netdata_proxy.conf
        mode: '0644'
      notify: Restart nginx

    - name: Ensure nginx enabled and started
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

# Backend tasks (install Netdata and ensure it runs on 19999)
- name: Backend - Netdata installer
  hosts: backend
  become: true
  gather_facts: yes

  tasks:
    - name: Install APT prerequisites (Debian)
      ansible.builtin.apt:
        name:
          - curl
          - lsb-release
          - ca-certificates
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install YUM prerequisites (RHEL)
      ansible.builtin.yum:
        name:
          - curl
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Download Netdata install script
      ansible.builtin.get_url:
        url: https://my-netdata.io/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: '0755'

    - name: Run Netdata install script
      ansible.builtin.shell: /bin/bash /tmp/netdata-kickstart.sh --dont-wait
      args:
        creates: /usr/sbin/netdata

    - name: Ensure netdata service enabled and started (if installed)
      ansible.builtin.service:
        name: netdata
        state: started
        enabled: true
      ignore_errors: true

    - name: Ensure Netdata binds to 0.0.0.0 and port 19999 (best-effort)
      ansible.builtin.blockinfile:
        path: /etc/netdata/netdata.conf
        create: yes
        marker: "# {mark} ANSIBLE NETDATA WEB SECTION"
        block: |
          [web]
          bind to = 0.0.0.0
          port = 19999
      notify: restart netdata
      ignore_errors: true

  handlers:
    - name: restart netdata
      ansible.builtin.service:
        name: netdata
        state: restarted
      ignore_errors: true
