---
# Common tasks: disable SELinux & firewalld
- name: Common setup
  hosts: all
  become: true
  tasks:
    - name: Disable SELinux persistently
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=disabled'
      ignore_errors: true

    - name: Stop and disable firewalld (RHEL only)
      service:
        name: firewalld
        state: stopped
        enabled: false
      when: ansible_os_family == "RedHat"
      ignore_errors: true

# Backend setup: Netdata
- name: Backend setup (Netdata)
  hosts: backend
  become: true
  tasks:
    - name: Install prerequisites
      apt:
        name: [curl, gnupg, lsb-release]
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Add Netdata repo (Debian)
      apt_repository:
        repo: "deb https://packagecloud.io/netdata/netdata/ubuntu/ {{ ansible_lsb.codename }} main"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Netdata (Debian)
      apt:
        name: netdata
        state: latest
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install Netdata (RHEL/Amazon)
      package:
        name: netdata
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Configure Netdata to run on port 19999
      blockinfile:
        path: /etc/netdata/netdata.conf
        create: yes
        block: |
          [web]
          bind to = 0.0.0.0
          port = 19999
      notify: restart netdata

  handlers:
    - name: restart netdata
      service:
        name: netdata
        state: restarted
        enabled: true

# Frontend setup: nginx reverse proxy
- name: Frontend setup (nginx proxy)
  hosts: frontend
  become: true
  tasks:
    - name: Install nginx
      package:
        name: nginx
        state: present

    - name: Configure nginx proxy to backend
      copy:
        dest: /etc/nginx/conf.d/netdata_proxy.conf
        content: |
          upstream netdata_backends {
          {% for host in groups['backend'] %}
              server {{ hostvars[host].ansible_host }}:19999;
          {% endfor %}
          }
          server {
              listen 80;
              location / {
                  proxy_pass http://netdata_backends;
              }
          }
      notify: restart nginx

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
        enabled: true
