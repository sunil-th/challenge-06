---
- name: Common setup
  hosts: all
  become: true
  vars:
    selinux_config_file: /etc/selinux/config

  tasks:
    - name: Disable SELinux persistently (RHEL family only)
      ansible.builtin.lineinfile:
        path: "{{ selinux_config_file }}"
        regexp: '^SELINUX='
        line: SELINUX=disabled
        state: present
      when: ansible_os_family == "RedHat"

    - name: Stop and disable firewalld (RHEL family only)
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: no
      when: ansible_os_family == "RedHat"

- name: Frontend setup (Nginx)
  hosts: frontend
  become: true

  tasks:
    - name: Install Nginx (Amazon Linux / RHEL)
      ansible.builtin.yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Nginx (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Configure Nginx reverse proxy to backend group
      ansible.builtin.template:
        src: nginx_reverse_proxy.conf.j2
        dest: /etc/nginx/conf.d/reverse_proxy.conf
      notify:
        - Restart Nginx

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: yes

- name: Backend setup (Netdata)
  hosts: backend
  become: true

  tasks:
    - name: Install prerequisites (Debian)
      ansible.builtin.apt:
        name:
          - curl
          - git
          - zlib1g-dev
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install prerequisites (RHEL)
      ansible.builtin.yum:
        name:
          - curl
          - git
          - zlib-devel
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Netdata using official script
      ansible.builtin.shell: |
        bash <(curl -Ss https://my-netdata.io/kickstart.sh) --dont-wait
      args:
        creates: /usr/sbin/netdata
